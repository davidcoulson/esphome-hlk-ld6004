esphome:
  name: ld6004-presence

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG # keeps UART0 (D6/D7) free for the radar

api:
ota:
  - platform: esphome
wifi:
  ssid: YOUR_SSID
  password: YOUR_PASSWORD

external_components:
  - source:
      type: local
      path: components

uart:
  id: radar_uart
  tx_pin: GPIO16 # D6 -> module RX
  rx_pin: GPIO17 # D7 <- module TX
  baud_rate: 115200

hlk_ld6004:
  id: radar
  uart_id: radar_uart
  presence: { name: "Radar presence" }
  moving_target: { name: "Radar moving target" }
  still_target: { name: "Radar still target" }
  zones:
    - name: "Radar zone 1 presence"
    - name: "Radar zone 2 presence"
  target_count: { name: "Radar targets" }
  moving_target_count: { name: "Radar moving targets" }
  still_target_count: { name: "Radar still targets" }
  targets:
    - x: { name: "Target 1 X" }
      y: { name: "Target 1 Y" }
      z: { name: "Target 1 Z" }
      distance: { name: "Target 1 distance" }
      angle: { name: "Target 1 angle" }
      speed: { name: "Target 1 speed" }

text_sensor:
  - platform: hlk_ld6004
    version: { name: "Radar firmware" }

select:
  - { platform: hlk_ld6004, type: sensitivity, name: "Radar sensitivity" }
  - { platform: hlk_ld6004, type: trigger_speed, name: "Radar trigger speed" }
  - { platform: hlk_ld6004, type: install_method, name: "Radar install method" }
  - { platform: hlk_ld6004, type: operating_mode, name: "Radar operating mode" }
  - { platform: hlk_ld6004, type: p20_output, name: "Radar OUT pin mode" }

number:
  - { platform: hlk_ld6004, type: delay_time, name: "Radar presence hold" }
  - { platform: hlk_ld6004, type: output_interval, name: "Radar output interval" }
  - { platform: hlk_ld6004, type: dwell_lifecycle, name: "Radar dwell lifecycle" }
  - { platform: hlk_ld6004, type: z_min, name: "Radar Z min" }
  - { platform: hlk_ld6004, type: z_max, name: "Radar Z max" }
  # Detection zone 1 box, metres from the radar. Each change rewrites the zone in the radar's flash.
  - { platform: hlk_ld6004, type: zone, zone_type: detection, zone: 1, bound: x_min, name: "Zone 1 X min" }
  - { platform: hlk_ld6004, type: zone, zone_type: detection, zone: 1, bound: x_max, name: "Zone 1 X max" }
  - { platform: hlk_ld6004, type: zone, zone_type: detection, zone: 1, bound: y_min, name: "Zone 1 Y min" }
  - { platform: hlk_ld6004, type: zone, zone_type: detection, zone: 1, bound: y_max, name: "Zone 1 Y max" }

button:
  - { platform: hlk_ld6004, type: auto_interference, name: "Radar learn interference" }
  - { platform: hlk_ld6004, type: clear_interference, name: "Radar clear interference" }
  - { platform: hlk_ld6004, type: reset_detection_area, name: "Radar reset detection area" }
  - { platform: hlk_ld6004, type: reset_unmanned, name: "Radar reset to unoccupied" }
